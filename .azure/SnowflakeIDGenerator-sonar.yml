name: 'SnowflakeIDGenerator-sonar'

trigger:
 branches:
   exclude:
     - 'azure-pipelines'
   include:
     - '*'

pool:
  vmImage: 'windows-latest'

variables:
  solution: 'SnowflakeIDGenerator.sln'
  mainProject: 'SnowflakeIDGenerator/SnowflakeIDGenerator.csproj'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- checkout: self
  fetchDepth: 0
  clean: true
  fetchTags: true
  displayName: 'git checkout'
  enabled: true
  retryCountOnTaskFailure: 2
  

- task: UseDotNet@2
  displayName: 'Install .NET 6 SDK'
  inputs:
    packageType: 'sdk'
    version: '6.x'

- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

- task: UseDotNet@2
  displayName: 'Install .NET 9 SDK'
  inputs:
    packageType: 'sdk'
    version: '9.x'

- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: SonarCloudPrepare@3
  inputs:
    SonarCloud: 'sonar snowflake'
    organization: 'fenase-1'
    scannerMode: 'dotnet'
    projectKey: 'fenase_SnowflakeIDGenerator2'
    projectVersion: '1.0'
    extraProperties: |
      # Additional properties that will be passed to the scanner, 
      # Put one key=value per line, example:
      sonar.exclusions=Examples/**/*.*
      sonar.coverage.exclusions=**/Exceptions/**/*.*, Examples/**/*.*
      sonar.qualitygate.wait=true

- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  displayName: 'NuGet Restore'
  inputs:
    restoreSolution: '$(solution)'

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    clean: true

- task: VSTest@3
  inputs:
    testSelector: 'testAssemblies'
    testAssemblyVer2: |
      **\bin\**\*.test.dll
    searchFolder: '$(System.DefaultWorkingDirectory)'
    codeCoverageEnabled: true
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    diagnosticsEnabled: true


- task: SonarCloudAnalyze@3
  inputs:
    jdkversion: 'JAVA_HOME_21_X64'

- task: SonarCloudPublish@3
  inputs:
    pollingTimeoutSec: '300'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Pipeline.Workspace)'
    publishLocation: 'pipeline'
